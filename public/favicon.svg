<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#111827"/>

  <!-- Subtle inner border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.75"/>

  <!-- "R" lettermark — geometric, bold, centered -->
  <text
    x="7.5"
    y="23"
    font-family="'Geist', 'Inter', ui-sans-serif, system-ui, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="-0.06em"
    fill="#fff7ed"
  >R</text>

  <!-- Orange glowing dot (top-right accent) -->
  <circle cx="24.5" cy="7.5" r="3" fill="url(#dot-glow)" filter="url(#glow)" opacity="0.35"/>
  <circle cx="24.5" cy="7.5" r="2" fill="#ea580c"/>
  <circle cx="24.5" cy="7.5" r="1" fill="#fdba74"/>
</svg>
